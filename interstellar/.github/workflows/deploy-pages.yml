# Publica el sitio estático en GitHub Pages (constitución §Restricciones Técnicas — Hosting).
# Sin build: se sirven los archivos tal cual (Principio I). El sitio queda en
# https://sergiotsk.github.io/Interstellar/ — accesible desde el celular sin ngrok.
# Basado en el template oficial "Deploy static content to Pages", con un paso extra
# que publica SOLO el contenido servible (no specs/, tests/, .specify/, *.md de proceso).
name: Deploy static content to Pages

on:
  # Corre en cada push a la rama por defecto
  push:
    branches: ["main"]

  # Permite lanzarlo a mano desde la pestaña Actions (redeploy a demanda)
  workflow_dispatch:

# Permisos del GITHUB_TOKEN para poder desplegar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela una en curso (deploy de producción)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar el sitio
        # Copia SOLO lo servible a _site/. Deja afuera specs/, tests/, .specify/,
        # .claude/, docs/ y los .md de proceso. .nojekyll desactiva Jekyll.
        run: |
          mkdir -p _site
          cp -r ./*.html css js assets _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
