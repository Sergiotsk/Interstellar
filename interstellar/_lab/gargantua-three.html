<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab · Gargantua — three.js (escena 3D)</title>
  <link rel="stylesheet" href="_lab.css">
</head>
<body class="lab">
  <div class="lab-bar">
    <strong>Gargantua · three.js</strong>
    <span class="lab-meta">three@0.169 (~170 KB) · escena 3D real — arrastrá para orbitar</span>
    <a href="index.html">← índice</a>
    <a href="gargantua-ogl.html">ver versión OGL →</a>
  </div>
  <div class="lab-readout" id="readout">cargando three.js…</div>

  <script type="module">
    const readout = document.getElementById('readout');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    try {
      const THREE = await import('https://esm.sh/three@0.169.0');
      const { OrbitControls } = await import(
        'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js?deps=three@0.169.0'
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.domElement.className = 'lab-canvas';
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070f);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.position.set(0, 2.4, 9);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.autoRotate = !reduce;
      controls.autoRotateSpeed = 0.6;
      controls.minDistance = 4;
      controls.maxDistance = 25;

      // --- Campo de estrellas: 3000 puntos sobre una cáscara esférica ---
      const N = 3000;
      const pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const rr = 60 + Math.random() * 40;
        const th = Math.acos(2 * Math.random() - 1);
        const ph = Math.random() * Math.PI * 2;
        pos[i * 3]     = rr * Math.sin(th) * Math.cos(ph);
        pos[i * 3 + 1] = rr * Math.sin(th) * Math.sin(ph);
        pos[i * 3 + 2] = rr * Math.cos(th);
      }
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
        color: 0xbfd0ff, size: 0.35, sizeAttenuation: true
      }));
      scene.add(stars);

      // --- Horizonte de sucesos: esfera negra + halo aditivo ---
      const INNER = 1.6, OUTER = 4.6;
      const horizon = new THREE.Mesh(
        new THREE.SphereGeometry(INNER * 0.94, 48, 48),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
      );
      scene.add(horizon);
      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(INNER * 1.5, 48, 48),
        new THREE.MeshBasicMaterial({
          color: 0xe8803b, transparent: true, opacity: 0.10,
          blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false
        })
      );
      scene.add(halo);

      // --- Disco de acreción: RingGeometry + ShaderMaterial animado ---
      const diskMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uInner: { value: INNER }, uOuter: { value: OUTER } },
        vertexShader: /* glsl */`
          varying vec3 vPos;
          void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: /* glsl */`
          precision highp float;
          varying vec3 vPos;
          uniform float uTime, uInner, uOuter;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
          float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
            return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
          float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }
          void main(){
            float rad = length(vPos.xy);
            float t = (rad - uInner) / (uOuter - uInner);
            if (t < 0.0 || t > 1.0) discard;
            float ang = atan(vPos.y, vPos.x);
            float flow = fbm(vec2(ang * 2.0 + uTime * 0.25, t * 6.0 - uTime * 1.5));
            float doppler = 0.5 + 0.6 * cos(ang - 0.5);
            vec3 hot = mix(vec3(0.5, 0.14, 0.03), vec3(1.0, 0.86, 0.62), flow);
            float edge = smoothstep(0.0, 0.14, t) * (1.0 - smoothstep(0.65, 1.0, t));
            float a = edge * (0.30 + 0.70 * flow) * (0.4 + doppler);
            gl_FragColor = vec4(hot * (1.1 + doppler), a);
          }
        `,
      });
      const disk = new THREE.Mesh(new THREE.RingGeometry(INNER, OUTER, 160, 12), diskMat);
      disk.rotation.x = -Math.PI / 2 + 0.32;   // casi plano, ladeado hacia la cámara
      scene.add(disk);

      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', resize);

      let frames = 0, last = performance.now(), t0 = performance.now();
      renderer.setAnimationLoop((now) => {
        now = now ?? performance.now();
        diskMat.uniforms.uTime.value = reduce ? 3.0 : (now - t0) * 0.001;
        if (!reduce) stars.rotation.y += 0.0004;
        controls.update();
        renderer.render(scene, camera);
        frames++;
        if (now - last >= 500) {
          const fps = Math.round((frames * 1000) / (now - last));
          const info = renderer.info.render;
          readout.innerHTML =
            `<b>${fps}</b> fps · three r169\ndraw calls: <b>${info.calls}</b> · tris: ${info.triangles}` +
            (reduce ? '\n(reduced-motion: sin auto-orbit)' : '');
          frames = 0; last = now;
        }
      });
    } catch (err) {
      readout.innerHTML = 'Error cargando three.js:\n' + (err && err.message || err);
      console.error(err);
    }
  </script>
</body>
</html>
