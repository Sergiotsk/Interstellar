<!-- body.home: layout.css superpone el header sobre el Hero solo en la home. -->
<body class="home">
  <main>
    <!-- Hero: video decorativo (aria-hidden); con prefers-reduced-motion js/layout.js lo pausa y queda el poster. -->
    <section class="hero" aria-labelledby="hero-titulo">
      <!-- preload="metadata": con "auto" bajaba ~2.2 MB al cargar la home y competia con el LCP. -->

             autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="assets/img/hero-fondo.webm" type="video/webm">
        <source src="assets/img/hero-fondo.mp4" type="video/mp4">
      </video>
      <hgroup class="hero-contenido">
        <h1 id="hero-titulo">Interstellar</h1>
        <p class="hero-tagline">Un recorrido por los mundos de la expedición Endurance, sus personajes, el viaje por el espacio-tiempo y la ciencia real que sostiene la historia.</p>
      </hgroup>
    </section>
  </main>
