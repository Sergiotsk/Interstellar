<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Tu mensaje llegó. Página de confirmación del formulario de contacto del sitio Interstellar.">
  <title>Mensaje recibido | Interstellar</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/contacto.css">
</head>
<body class="contacto">
  <main>
    <div class="contacto-split is-recibido">
      <div class="contacto-panel">
        <div class="contacto-encabezado">
          <h1>Mensaje recibido</h1>
          <p>
            Gracias por escribir. <strong>Del otro lado del tiempo esto puede
            demorar</strong> —como en la película—, pero llega.
          </p>
        </div>

        <div class="contacto-consola">
          <p class="consola-rotulo">
            <span class="led" aria-hidden="true"></span>
            <span>Recibido</span>
          </p>
          <p class="form-nota" data-estado="ok">RECIBIDO DEL OTRO LADO · la respuesta puede tardar</p>
          <p class="contacto-volver"><a href="index.html">← Volver al inicio</a></p>
        </div>
      </div>

      <div class="contacto-visor">
        <img
          src="assets/img/ciencia-teseracto-biblioteca.jpg"
          alt="Cooper, dentro del tesseract, mira a través de la estantería hacia la habitación de Murph"
        >
      </div>
    </div>
  </main>
  <script type="module" src="js/layout.js"></script>
</body>
</html>
