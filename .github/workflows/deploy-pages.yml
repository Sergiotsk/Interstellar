# Publica el sitio estático en GitHub Pages (constitución §Restricciones Técnicas — Hosting).
# El sitio vive en el subdirectorio interstellar/ del repo; este workflow debe estar en
# la raíz del repo (.github/workflows/) para que GitHub Actions lo detecte.
# Sin build: se sirven los archivos tal cual (Principio I).
# Publica en https://sergiotsk.github.io/Interstellar/ — accesible desde el celular sin ngrok.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    # Solo redeploya cuando cambia contenido del sitio.
    paths:
      - "interstellar/**.html"
      - "interstellar/css/**"
      - "interstellar/js/**"
      - "interstellar/assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}  # redeploy manual a demanda desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar el sitio
        # Copia SOLO lo servible de interstellar/ a _site/. Deja afuera specs/,
        # tests/, .specify/ y los .md de proceso. .nojekyll desactiva Jekyll.
        run: |
          mkdir -p _site
          cp -r interstellar/*.html interstellar/css interstellar/js interstellar/assets _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
