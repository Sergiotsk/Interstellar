<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap");

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        .frame-inner {
          position: absolute;
          inset: 0;
          background: #0a0e1a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 70px 160px;
          gap: 26px;
          text-align: center;
          overflow: hidden;
          opacity: 0;
        }

        .kicker {
          font-family: "Share Tech Mono", monospace;
          font-size: 24px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #a8a294;
        }

        .diagrama {
          position: relative;
          width: 1300px;
          height: 260px;
        }
        .masa {
          position: absolute;
          left: 340px;
          top: 50%;
          width: 60px;
          height: 60px;
          margin-top: -30px;
          border-radius: 50%;
          background: #12161a;
          box-shadow: 0 0 44px 12px rgba(232, 128, 59, 0.32);
          opacity: 0;
        }
        .reloj-wrap {
          position: absolute;
          top: 50%;
          margin-top: -75px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
          opacity: 0;
        }
        .reloj-cerca { left: 60px; }
        .reloj-lejos { left: 1080px; }
        .reloj-label {
          font-family: "Exo 2", sans-serif;
          font-size: 22px;
          color: #a8a294;
        }

        .cuerpo {
          font-family: "Exo 2", sans-serif;
          font-weight: 400;
          font-size: 32px;
          line-height: 1.5;
          color: #efe7d6;
          max-width: 1180px;
          opacity: 0;
        }
        .cuerpo strong { font-weight: 500; }

        .etiqueta-rigor {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 22px;
          border-radius: 999px;
          background: rgba(20, 28, 49, 0.88);
          border: 1px solid rgba(239, 231, 214, 0.22);
          border-left: 4px solid rgba(239, 231, 214, 0.55);
          font-family: "Exo 2", sans-serif;
          font-size: 23px;
          font-weight: 500;
          color: #efe7d6;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="concepto" data-width="1920" data-height="1080">
        <div class="frame-inner" id="inner">
          <p class="kicker" id="kicker">Gravedad y tiempo</p>

          <div class="diagrama">
            <div class="masa" id="masa"></div>

            <div class="reloj-wrap reloj-cerca" id="reloj-cerca">
              <svg width="150" height="150" viewBox="0 0 150 150" data-layout-allow-overflow="true">
                <circle cx="75" cy="75" r="66" fill="none" stroke="rgba(239,231,214,0.3)" stroke-width="3" />
                <line id="mano-cerca" x1="75" y1="75" x2="75" y2="18" stroke="#efe7d6" stroke-width="6" stroke-linecap="round" style="transform-origin: 75px 75px" />
                <circle cx="75" cy="75" r="5" fill="#efe7d6" />
              </svg>
              <p class="reloj-label">Cerca de la masa</p>
            </div>

            <div class="reloj-wrap reloj-lejos" id="reloj-lejos">
              <svg width="150" height="150" viewBox="0 0 150 150" data-layout-allow-overflow="true">
                <circle cx="75" cy="75" r="66" fill="none" stroke="rgba(239,231,214,0.3)" stroke-width="3" />
                <line id="mano-lejos" x1="75" y1="75" x2="75" y2="18" stroke="#efe7d6" stroke-width="6" stroke-linecap="round" style="transform-origin: 75px 75px" />
                <circle cx="75" cy="75" r="5" fill="#efe7d6" />
              </svg>
              <p class="reloj-label">Lejos de la masa</p>
            </div>
          </div>

          <p class="cuerpo" id="cuerpo">
            <strong>Cuanto más fuerte es la gravedad en un lugar, más lento pasa el tiempo ahí.</strong>
            Los relojes atómicos la miden; el GPS la corrige para no acumular errores de kilómetros.
          </p>
          <span class="etiqueta-rigor" id="rigor">✓ Ciencia real</span>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Entrada del frame completo (solapa con la salida de #apertura).
        tl.fromTo("#inner", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power1.inOut" }, 0);

        // Diagrama: masa + ambos relojes aparecen.
        tl.fromTo("#masa", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0.6);
        tl.fromTo("#reloj-cerca", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.7);
        tl.fromTo("#reloj-lejos", { autoAlpha: 0, x: 20 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);

        // Las manecillas giran a ritmos MUY distintos: el reloj cerca de la masa
        // gira lento (90°), el lejano gira rapido (3 vueltas) en el mismo lapso real.
        tl.fromTo("#mano-cerca", { rotation: 0 }, { rotation: 80, duration: 9, ease: "none" }, 1.4);
        tl.fromTo("#mano-lejos", { rotation: 0 }, { rotation: 1080, duration: 9, ease: "none" }, 1.4);

        tl.fromTo("#cuerpo", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.0);
        tl.fromTo("#rigor", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 9.9);

        // Salida del frame completo (solapa con la entrada de #miller).
        tl.fromTo("#inner", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.6, ease: "power1.inOut", immediateRender: false }, 10.9);

        window.__timelines["concepto"] = tl;
      </script>
    </template>
  </body>
</html>
