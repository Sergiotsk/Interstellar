<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap");
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        .frame-inner {
          position: absolute;
          inset: 0;
          background: #0a0e1a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 90px 160px;
          gap: 28px;
          text-align: center;
          overflow: hidden;
        }
        .campo-estelar { position: absolute; inset: 0; }
        .campo-estelar::before {
          content: "";
          position: absolute;
          width: 2px;
          height: 2px;
          box-shadow:
            112px 84px #efe7d6, 340px 210px #efe7d6, 588px 60px #efe7d6,
            812px 340px #efe7d6, 1040px 120px #efe7d6, 1290px 400px #efe7d6,
            1520px 90px #efe7d6, 1750px 260px #efe7d6, 90px 520px #efe7d6,
            330px 680px #efe7d6, 600px 780px #efe7d6, 860px 610px #efe7d6,
            1100px 720px #efe7d6, 1360px 560px #efe7d6, 1620px 700px #efe7d6,
            1830px 480px #efe7d6, 60px 900px #efe7d6, 400px 960px #efe7d6,
            720px 940px #efe7d6, 980px 980px #efe7d6, 1250px 900px #efe7d6;
          opacity: 0.5;
        }
        .kicker {
          font-family: "Share Tech Mono", monospace;
          font-size: 26px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #e8803b;
          opacity: 0;
          position: relative;
        }
        .titular {
          font-family: "Orbitron", sans-serif;
          font-weight: 800;
          font-size: 74px;
          letter-spacing: 0.03em;
          text-transform: uppercase;
          line-height: 1.25;
          color: #efe7d6;
          max-width: 1450px;
          position: relative;
        }
        .titular .palabra { display: inline-block; opacity: 0; }
      </style>

      <div id="root" data-composition-id="apertura" data-width="1920" data-height="1080">
        <div class="frame-inner" id="inner">
          <div class="campo-estelar"></div>
          <p class="kicker" id="kicker">La ciencia · Agujeros de gusano</p>
          <h1 class="titular" id="titular">
            <span class="palabra">¿Existe</span> <span class="palabra">un</span>
            <span class="palabra">atajo</span> <span class="palabra">real</span>
            <span class="palabra">en</span> <span class="palabra">el</span>
            <span class="palabra">espacio-tiempo?</span>
          </h1>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#kicker", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(
          "#titular .palabra",
          { autoAlpha: 0, y: 16 },
          { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.12 },
          0.5,
        );
        // Fundido de salida del frame completo (solapa con la entrada de #concepto).
        tl.fromTo("#inner", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.5, ease: "power1.inOut" }, 3.59);

        window.__timelines["apertura"] = tl;
      </script>
    </template>
  </body>
</html>
