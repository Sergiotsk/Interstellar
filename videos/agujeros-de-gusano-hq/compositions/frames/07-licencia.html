<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap");

        #root { position: absolute; inset: 0; width: 100%; height: 100%; }
        .frame-inner {
          position: absolute;
          inset: 0;
          background: #0a0e1a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 55px 150px;
          gap: 18px;
          text-align: center;
          overflow: hidden;
          opacity: 0;
        }

        .kicker {
          font-family: "Share Tech Mono", monospace;
          font-size: 24px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #a8a294;
          opacity: 0;
        }

        .diagrama { position: relative; width: 500px; height: 260px; opacity: 0; }
        .diagrama-label {
          font-family: "Exo 2", sans-serif;
          font-size: 22px;
          font-weight: 500;
          color: #e8803b;
          margin-top: 4px;
          opacity: 0;
        }

        .cuerpo {
          font-family: "Exo 2", sans-serif;
          font-weight: 400;
          font-size: 30px;
          line-height: 1.5;
          color: #efe7d6;
          max-width: 1250px;
          opacity: 0;
        }
        .cuerpo strong { font-weight: 500; }

        .etiqueta-rigor {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 22px;
          border-radius: 999px;
          background: rgba(20, 28, 49, 0.88);
          border: 1px solid rgba(239, 231, 214, 0.22);
          border-left: 3px solid #e8803b;
          font-family: "Exo 2", sans-serif;
          font-size: 23px;
          font-weight: 500;
          color: #efe7d6;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="licencia" data-width="1920" data-height="1080">
        <div class="frame-inner" id="inner">
          <p class="kicker" id="kicker">La capa de ficción</p>

          <div class="diagrama" id="diagrama">
            <svg width="500" height="220" viewBox="0 0 500 220" data-layout-allow-overflow="true">
              <g id="chevrones" opacity="0">
                <path d="M 220,10 L 250,32 L 280,10" fill="none" stroke="#efe7d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M 220,34 L 250,56 L 280,34" fill="none" stroke="#efe7d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
                <path d="M 220,58 L 250,80 L 280,58" fill="none" stroke="#efe7d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
              </g>
              <g id="anillo" transform="translate(250,150)">
                <circle id="anillo-glow" r="46" fill="none" stroke="#e8803b" stroke-width="2" opacity="0" />
                <circle r="34" fill="none" stroke="#efe7d6" stroke-width="3" />
                <circle r="34" fill="none" stroke="#e8803b" stroke-width="1.5" stroke-dasharray="8 20" id="anillo-giro" opacity="0.7" />
              </g>
            </svg>
          </div>
          <p class="diagrama-label" id="diagrama-label">colocado a propósito</p>

          <p class="cuerpo" id="cuerpo">
            Que <strong>unos seres de dimensiones superiores</strong> hayan colocado ese agujero
            de gusano ahí, a propósito, para darnos una salida.
          </p>
          <span class="etiqueta-rigor" id="rigor">✎ Licencia narrativa</span>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#inner", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power1.inOut" }, 0);
        tl.fromTo("#kicker", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);
        tl.fromTo("#diagrama", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, 0.9);

        // Algo externo "coloca" el agujero de gusano -- motivo abstracto, sin figuras literales.
        tl.fromTo("#chevrones", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.2);
        tl.to("#chevrones", { y: 20, duration: 1.0, ease: "power1.in" }, 2.0);
        tl.to("#chevrones", { autoAlpha: 0, duration: 0.4 }, 2.8);

        tl.fromTo("#anillo-glow", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 0.9, scale: 1, duration: 0.4, ease: "power2.out" }, 2.9);
        tl.to("#anillo-glow", { autoAlpha: 0, scale: 1.3, duration: 0.7, ease: "power1.out", overwrite: "auto" }, 3.3);
        tl.to("#anillo-giro", { rotation: 200, transformOrigin: "0px 0px", duration: 6, ease: "none" }, 1.2);
        tl.fromTo("#diagrama-label", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.4);

        tl.fromTo("#cuerpo", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.2);
        tl.fromTo("#rigor", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.27);

        tl.fromTo("#inner", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, 11.77);

        window.__timelines["licencia"] = tl;
      </script>
    </template>
  </body>
</html>
