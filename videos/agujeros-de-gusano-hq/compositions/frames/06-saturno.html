<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap");

        #root { position: absolute; inset: 0; width: 100%; height: 100%; }
        .frame-inner {
          position: absolute;
          inset: 0;
          background: #0a0e1a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 55px 150px;
          gap: 18px;
          text-align: center;
          overflow: hidden;
          opacity: 0;
        }

        .kicker {
          font-family: "Share Tech Mono", monospace;
          font-size: 24px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #a8a294;
          opacity: 0;
        }

        .diagrama { position: relative; width: 1320px; height: 300px; opacity: 0; }
        .punto-label {
          font-family: "Exo 2", sans-serif;
          font-size: 20px;
          color: #a8a294;
        }
        .punto-saturno { position: absolute; left: 6px; top: 178px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 150px; }
        .punto-destino { position: absolute; left: 1160px; top: 178px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 150px; }

        .ruta-label {
          font-family: "Exo 2", sans-serif;
          font-size: 22px;
          font-weight: 500;
          opacity: 0;
        }
        .ruta-larga-label { position: absolute; left: 470px; top: 0px; color: #a8a294; }
        .ruta-atajo-label { position: absolute; left: 460px; top: 250px; color: #efe7d6; }

        .cuerpo {
          font-family: "Exo 2", sans-serif;
          font-weight: 400;
          font-size: 30px;
          line-height: 1.5;
          color: #efe7d6;
          max-width: 1250px;
          opacity: 0;
        }
        .cuerpo strong { font-weight: 500; }

        .etiqueta-rigor {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 22px;
          border-radius: 999px;
          background: rgba(20, 28, 49, 0.88);
          border: 1px solid rgba(239, 231, 214, 0.22);
          border-left: 3px dashed rgba(239, 231, 214, 0.4);
          font-family: "Exo 2", sans-serif;
          font-size: 23px;
          font-weight: 500;
          color: #efe7d6;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="saturno" data-width="1920" data-height="1080">
        <div class="frame-inner" id="inner">
          <p class="kicker" id="kicker">En Interstellar</p>

          <div class="diagrama" id="diagrama">
            <svg width="1320" height="300" viewBox="0 0 1320 300" data-layout-allow-overflow="true">
              <path id="ruta-larga" d="M60,220 C 350,-10 970,-10 1240,220" fill="none"
                stroke="#a8a294" stroke-width="2" stroke-dasharray="8 10"
                stroke-dashoffset="1600" pathLength="1600" opacity="0" />

              <path id="ruta-atajo" d="M60,220 Q650,150 1240,220" fill="none"
                stroke="#efe7d6" stroke-width="5" stroke-linecap="round"
                stroke-dasharray="1500" stroke-dashoffset="1500" pathLength="1500" opacity="0" />

              <g id="anillo-agujero" opacity="0" transform="translate(650,190)">
                <circle r="22" fill="none" stroke="#efe7d6" stroke-width="3" />
                <circle id="anillo-agujero-giro" r="22" fill="none" stroke="#e8803b" stroke-width="1.5" opacity="0.6" stroke-dasharray="10 24" />
              </g>

              <!-- Saturno: esfera + anillos -->
              <g transform="translate(60,220)">
                <ellipse cx="0" cy="0" rx="52" ry="16" fill="none" stroke="#a8a294" stroke-width="3" transform="rotate(-18)" />
                <circle cx="0" cy="0" r="26" fill="#12161a" stroke="rgba(239,231,214,0.4)" stroke-width="2" />
              </g>
              <circle id="punto-destino-dot" cx="1240" cy="220" r="9" fill="#efe7d6" opacity="0" />
              <circle cx="1265" cy="205" r="4" fill="#a8a294" opacity="0" id="destino-extra-1" />
              <circle cx="1258" cy="238" r="3" fill="#a8a294" opacity="0" id="destino-extra-2" />
            </svg>

            <div class="punto-saturno"><span class="punto-label">Saturno</span></div>
            <div class="punto-destino"><span class="punto-label">Destino</span></div>
            <p class="ruta-label ruta-larga-label" id="label-largo">miles de años de viaje</p>
            <p class="ruta-label ruta-atajo-label" id="label-atajo">un atajo: la misión es posible</p>
          </div>

          <p class="cuerpo" id="cuerpo">
            <strong>El agujero de gusano cerca de Saturno es lo que hace posible toda la
            misión:</strong> sin él, los planetas candidatos están a miles de años de viaje.
          </p>
          <span class="etiqueta-rigor" id="rigor">~ Especulación plausible</span>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#inner", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power1.inOut" }, 0);
        tl.fromTo("#kicker", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);
        tl.fromTo("#diagrama", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, 0.7);
        tl.fromTo(["#punto-destino-dot", "#destino-extra-1", "#destino-extra-2"], { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 0.9);

        tl.fromTo("#ruta-larga", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 1.3);
        tl.to("#ruta-larga", { strokeDashoffset: 0, duration: 1.5, ease: "power1.inOut" }, 1.3);
        tl.fromTo("#label-largo", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.4);

        tl.to("#ruta-larga", { autoAlpha: 0.12, duration: 0.6, ease: "power1.inOut" }, 3.6);
        tl.to("#label-largo", { autoAlpha: 0.2, duration: 0.6 }, 3.6);
        tl.fromTo("#ruta-atajo", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 3.9);
        tl.to("#ruta-atajo", { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 3.9);
        tl.fromTo("#anillo-agujero", { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 4.6);
        tl.to("#anillo-agujero-giro", { rotation: 360, transformOrigin: "0px 0px", duration: 8, ease: "none" }, 4.6);
        tl.fromTo("#label-atajo", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.0);

        tl.fromTo("#cuerpo", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 5.8);
        tl.fromTo("#rigor", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 14.92);

        tl.fromTo("#inner", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, 15.42);

        window.__timelines["saturno"] = tl;
      </script>
    </template>
  </body>
</html>
