<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap");

        #root { position: absolute; inset: 0; width: 100%; height: 100%; }
        .frame-inner {
          position: absolute;
          inset: 0;
          background: #0a0e1a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 90px 160px;
          gap: 24px;
          text-align: center;
          overflow: hidden;
          opacity: 0;
        }

        .titular {
          font-family: "Orbitron", sans-serif;
          font-weight: 800;
          font-size: 66px;
          letter-spacing: 0.03em;
          text-transform: uppercase;
          line-height: 1.25;
          color: #efe7d6;
          max-width: 1550px;
        }
        .titular .palabra { display: inline-block; opacity: 0; }
        .titular .acento { color: #e8803b; }

        .fuente {
          font-family: "Exo 2", sans-serif;
          font-style: italic;
          font-size: 23px;
          color: #a8a294;
          opacity: 0;
          max-width: 1300px;
        }
      </style>

      <div id="root" data-composition-id="cierre" data-width="1920" data-height="1080">
        <div class="frame-inner" id="inner">
          <h1 class="titular" id="titular">
            <span class="palabra">Un</span> <span class="palabra">atajo</span>
            <span class="palabra">real</span> <span class="palabra">en</span>
            <span class="palabra">las</span> <span class="palabra">ecuaciones</span>
            <span class="palabra">de</span> <span class="palabra">Einstein</span>
            <span class="palabra">—</span> <span class="palabra acento">pero</span>
            <span class="palabra acento">nunca</span> <span class="palabra acento">vimos</span>
            <span class="palabra acento">uno</span>
          </h1>
          <p class="fuente" id="fuente">
            Thorne, K. — "The Science of Interstellar" (2014) · James, O. et al. —
            "Visualizing Interstellar's Wormhole", Am. J. Phys. 83 (2015)
          </p>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#inner", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power1.inOut" }, 0);
        tl.fromTo(
          "#titular .palabra",
          { autoAlpha: 0, y: 16 },
          { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.08 },
          0.6,
        );
        tl.fromTo("#fuente", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 2.6);

        // Frame final: sin animacion de salida, se sostiene hasta el final del video.

        window.__timelines["cierre"] = tl;
      </script>
    </template>
  </body>
</html>
