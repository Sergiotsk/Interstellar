<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@400;500&family=Share+Tech+Mono&display=swap");

        #root { position: absolute; inset: 0; width: 100%; height: 100%; }
        .frame-inner {
          position: absolute;
          inset: 0;
          background: #0a0e1a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 55px 150px;
          gap: 18px;
          text-align: center;
          overflow: hidden;
          opacity: 0;
        }

        .kicker {
          font-family: "Share Tech Mono", monospace;
          font-size: 24px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #a8a294;
          opacity: 0;
        }

        .diagrama { position: relative; width: 900px; height: 260px; opacity: 0; }

        .estado-label {
          position: relative;
          font-family: "Exo 2", sans-serif;
          font-size: 23px;
          font-weight: 500;
          color: #a8a294;
          margin-top: 6px;
          height: 30px;
        }
        .estado-label span { position: absolute; left: 50%; top: 0; transform: translateX(-50%); white-space: nowrap; opacity: 0; }

        .cuerpo {
          font-family: "Exo 2", sans-serif;
          font-weight: 400;
          font-size: 30px;
          line-height: 1.5;
          color: #efe7d6;
          max-width: 1250px;
          opacity: 0;
        }
        .cuerpo strong { font-weight: 500; }

        .etiqueta-rigor {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 22px;
          border-radius: 999px;
          background: rgba(20, 28, 49, 0.88);
          border: 1px solid rgba(239, 231, 214, 0.22);
          border-left: 3px dashed rgba(239, 231, 214, 0.4);
          font-family: "Exo 2", sans-serif;
          font-size: 23px;
          font-weight: 500;
          color: #efe7d6;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="materia-exotica" data-width="1920" data-height="1080">
        <div class="frame-inner" id="inner">
          <p class="kicker" id="kicker">El problema de mantenerlo abierto</p>

          <div class="diagrama" id="diagrama">
            <svg width="900" height="230" viewBox="0 0 900 230" data-layout-allow-overflow="true">
              <g id="wall-left">
                <path d="M 60,10 C 300,10 330,220 450,220 L 450,10 Z" fill="none" stroke="#efe7d6" stroke-width="2.5" opacity="0.55" />
                <path d="M 60,10 C 300,10 330,220 450,220" fill="none" stroke="#efe7d6" stroke-width="3" />
              </g>
              <g id="wall-right">
                <path d="M 840,10 C 600,10 570,220 450,220" fill="none" stroke="#efe7d6" stroke-width="3" />
              </g>
              <g id="prop" opacity="0" transform="translate(450,115)">
                <circle r="26" fill="none" stroke="#a8a294" stroke-width="2.5" stroke-dasharray="5 6" />
                <line x1="-13" y1="0" x2="13" y2="0" stroke="#a8a294" stroke-width="3" stroke-linecap="round" />
              </g>
            </svg>
          </div>
          <p class="estado-label">
            <span id="estado-cierra">se cierra al instante</span>
            <span id="estado-abierto">con materia exótica: se sostiene abierto</span>
          </p>

          <p class="cuerpo" id="cuerpo">
            Haría falta <strong>«materia exótica», con energía negativa,</strong> para
            apuntalarlo. Nadie observó nunca esa materia en la cantidad necesaria.
          </p>
          <span class="etiqueta-rigor" id="rigor">~ Especulación plausible</span>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#inner", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power1.inOut" }, 0);
        tl.fromTo("#kicker", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);
        tl.fromTo("#diagrama", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, 0.9);
        tl.fromTo("#estado-cierra", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 1.1);

        // El tunel se cierra: las paredes colapsan hacia el centro (agujero de gusano natural, sin apuntalar).
        tl.to("#wall-left", { x: 55, duration: 1.6, ease: "power2.in" }, 1.6);
        tl.to("#wall-right", { x: -55, duration: 1.6, ease: "power2.in" }, 1.6);
        tl.to("#estado-cierra", { autoAlpha: 0, duration: 0.3 }, 3.0);

        // Aparece la materia exotica (energia negativa) y apuntala el tunel: las paredes vuelven a abrirse.
        tl.fromTo("#prop", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 3.6);
        tl.to("#wall-left", { x: 8, duration: 1.1, ease: "power2.out" }, 3.8);
        tl.to("#wall-right", { x: -8, duration: 1.1, ease: "power2.out" }, 3.8);
        tl.fromTo("#estado-abierto", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 3.9);

        tl.fromTo("#cuerpo", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 5.4);
        tl.fromTo("#rigor", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 14.92);

        tl.fromTo("#inner", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, 15.42);

        window.__timelines["materia-exotica"] = tl;
      </script>
    </template>
  </body>
</html>
